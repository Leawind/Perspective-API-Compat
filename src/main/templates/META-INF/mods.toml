modLoader = "javafml"
loaderVersion = "*"
issueTrackerURL = "${issues_url}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = "${mod_description}"
authors = "${mod_author}"
displayURL = "${home_url}"

[["dependencies.${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${mc}"
ordering = "NONE"
side = "CLIENT"

[["dependencies.${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "*"
ordering = "NONE"
side = "CLIENT"

[["dependencies.${mod_id}"]]
modId = "perspective_api"
mandatory = true
versionRange = "[${perspectiveApiVersion},)"
ordering = "AFTER"
side = "CLIENT"

[["dependencies.${mod_id}"]]
modId = "shouldersurfing"
mandatory = false
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"
